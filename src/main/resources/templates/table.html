<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>葡萄酒数据表格展示</title>
    <style>
        body {font-size: 16px; padding: 20px; font-family: SimSun,serif;}
        h1 {font-weight: normal; margin-bottom: 30px;}
        table {border-collapse: collapse; width: 100%; margin-top: 20px;}
        th, td {border: 1px solid #ddd; padding: 8px; text-align: left;}
        th {background-color: #f2f2f2; font-weight: normal;}
        tr:nth-child(even) {background-color: #f9f9f9;}
        .btns {margin-bottom: 30px;}
        button {font-size: 16px; padding: 8px 16px; margin-right: 10px;}
        .back-btn {display: inline-block; padding: 8px 16px; background: #409EFF; color: white; text-decoration: none; border-radius: 4px;}
    </style>
</head>
<body>
    <h1>葡萄酒数据表格展示</h1>
    <div class="btns">
        <a href="/" class="back-btn">返回首页</a>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>评分</th>
                <th>评分人数</th>
                <th>价格</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item, stat : ${dataList}">
                <td th:text="${stat.count}"></td>
                <td th:text="${item.rating}"></td>
                <td th:text="${item.people}"></td>
                <td th:text="${item.price}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
